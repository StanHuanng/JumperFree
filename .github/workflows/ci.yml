name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Route plan smoke
        run: |
          python -m jumperfree route xbar init --topology v01 --state out/plan-new.json
          cp out/plan-new.json out/plan-old.json
          python -m jumperfree route xbar create --net a --nodes Clip0,Clip15 --state out/plan-new.json
          python -m jumperfree route plan --new out/plan-new.json
          python -m jumperfree route plan --new out/plan-new.json --old out/plan-old.json --base-epoch 0
      - name: Host CLI smoke
        run: |
          python -m jumperfree host set --clip 0 --rgb 255,128,0 --mock
          python -m jumperfree host clear --clip 15 --mock
          python -m jumperfree host clear-all --mock
          python -m jumperfree host status --mock
          python -m jumperfree route xbar init --topology v01 --state out/guide-smoke.json
          python -m jumperfree route xbar create --net a --nodes Clip0,Clip15 --state out/guide-smoke.json
          python -m jumperfree host guide --state out/guide-smoke.json --mock
      - name: Crossbar CLI smoke
        run: |
          python -m jumperfree route xbar init --topology small --chips 3 --x-lines 2 --y-lines 2 --state out/small.json
          python -m jumperfree route xbar create --net SPAN --nodes N0,N2,N5 --state out/small.json
          python -m jumperfree route xbar query --net SPAN --state out/small.json
          python -m jumperfree route xbar delete --net SPAN --state out/small.json
